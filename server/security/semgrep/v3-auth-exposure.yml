rules:
  - id: express-route-without-authentication
    languages: [javascript]
    severity: ERROR
    message: >-
      Express route registered without authentication middleware and the
      router has no router.use(authMiddleware). Sensitive endpoints must
      require a valid session (CWE-306, OWASP A07/A01).
    metadata:
      cwe: "CWE-306: Missing Authentication for Critical Function"
      owasp: "A07:2021 - Identification and Authentication Failures"
    patterns:
      - pattern-either:
          - pattern: $ROUTER.get($PATH, $HANDLER)
          - pattern: $ROUTER.post($PATH, $HANDLER)
          - pattern: $ROUTER.put($PATH, $HANDLER)
          - pattern: $ROUTER.patch($PATH, $HANDLER)
          - pattern: $ROUTER.delete($PATH, $HANDLER)
      - pattern-not-inside: |
          $ROUTER.use(authMiddleware);
          ...
  - id: mongoose-select-deny-list
    languages: [javascript]
    severity: WARNING
    message: >-
      Response fields chosen with a deny-list (-field). Every other field,
      including refreshTokenHash, email and phone, is returned. Use an
      allow-list of safe fields instead (CWE-200 / CWE-359).
    metadata:
      cwe: "CWE-200: Exposure of Sensitive Information"
    pattern-regex: \.select\(\s*["']-\w+