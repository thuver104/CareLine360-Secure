rules:
  - id: error-response-leaks-raw-message
    languages: [javascript]
    severity: ERROR
    message: >-
      A 500-level error response returns the raw error message/stack to the
      client (err.message / error.message / err.stack). This can expose
      database, file-path or library internals (CWE-209, OWASP A05). Return a
      fixed generic message and log the detail server-side instead.
    metadata:
      cwe: "CWE-209: Generation of Error Message Containing Sensitive Information"
      owasp: "A05:2021 - Security Misconfiguration"
    patterns:
      - pattern-either:
          - pattern: "res.status(500).json({ ..., message: $E.message, ... })"
          - pattern: "res.status(500).json({ ..., detail: $E.message, ... })"
          - pattern: "res.status(500).json({ ..., error: $E.message, ... })"
          - pattern: "res.status(500).json({ ..., stack: $E.stack, ... })"
          - pattern: "res.status($S).json({ ..., message: $E.message || $D, ... })"
          - pattern: "res.json({ ..., stack: $E.stack, ... })"
